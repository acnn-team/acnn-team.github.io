  download_label: "Download ACNN-CSP 1.1.0"
  checksum_url: "/assets/downloads/acnn-csp-1.1.0-linux-64-conda-channel.tar.gz.sha256"
  checksum_label: "SHA256 checksum"
  sha256: "c0ce4109d0bd039acbd63b1144505a3d3e88e88670d7377901b9a508d4cf6b37"
  new_features:
    - "Adds PyXtal as an optional online structure generator."
    - "Includes acnn_xtalgen for standalone symmetric structure generation with pair-distance constraints and space-group caching."
    - "Adds a structure space-group column to acnn_pdb output."
  new_features_zh:
    - "新增可选的 PyXtal 在线结构生成后端。"
    - "新增 acnn_xtalgen 命令，支持带原子间距约束的对称性结构生成和空间群缓存。"
    - "acnn_pdb 输出新增结构空间群一列。"
  bug_fixes:
    - "Validates bootstrap outputs before continuing to DFT, avoiding false failures caused by child-process status collection."
    - "Provides independent online generation distance settings; default volume scales are 1.2 for CALYPSO and 1.3 for PyXtal."
  bug_fixes_zh:
    - "初始化后核验实际结构文件，避免子进程状态收集异常导致已完成的生成任务误报失败。"
    - "在线结构生成的距离限制可独立调整；CALYPSO 和 PyXtal 的默认体积缩放系数分别为 1.2 和 1.3。"
  compatibility:
    - "Linux x86-64."
    - "glibc 2.17 or newer."
    - "Conda or Miniforge."
    - "CPU-only LibTorch package."
  compatibility_zh:
    - "Linux x86-64。"
    - "glibc 2.17 或更新版本。"
    - "Conda 或 Miniforge。"
    - "CPU-only LibTorch 包。"
  packages:
